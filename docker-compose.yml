services:
  app:
    # Stable, registry-ready name for local builds; set IMAGE_REGISTRY/IMAGE_TAG
    # to retag for a registry.
    image: "${IMAGE_REGISTRY:-}litefront:${IMAGE_TAG:-latest}"
    # VITE_* values are baked into the bundle at build time, so the image must
    # always match THIS checkout's .env — always rebuild instead of reusing
    # whatever the tag points at (a stale/other-environment bundle). To run a
    # pulled prebuilt image instead, use docker-compose.prod.yml.
    pull_policy: build
    build:
      context: .
    restart: unless-stopped
    # Cap resources so a leak in the SSR process can't exhaust the host. Honored
    # by `docker compose up` (Compose v2); tune to the target host.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    env_file:
      - .env
    # The container always listens on 3000; PORT in .env only selects the HOST
    # port via the "${PORT:-3000}:3000" mapping (environment overrides env_file).
    environment:
      PORT: 3000
    # Published on loopback only — a host reverse proxy terminates TLS.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # No healthcheck here on purpose: the app's HEALTHCHECK lives in the
    # Dockerfile — one source of truth, honored by any orchestrator.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
