# Hooks are deliberately thin: all logic lives in npm scripts (package.json), and
# the hook just calls one script per stage. This way a developer can run the exact
# same checks by hand: `npm run verify:commit` (fast) / `npm run verify:push` (full).
#
# There is no CI here — the whole quality guarantee rests on these hooks, so
# pre-push is a superset: it repeats the fast checks and adds the slow ones.
#
# Every hook check lives in this file. `npm install` runs `lefthook install`
# (postinstall), which renames a hook another tool wrote to `<hook>.old` and never
# runs it — so a check added straight to .git/hooks silently stops after the next
# install. Add it as a command here instead (e.g. `run: docc check`).
pre-commit:
  commands:
    verify:
      run: npm run verify:commit # fast static checks + secrets scan
    docs:
      # meta ADR-0011: inside the LiteStack meta-repo a docc: tag here must agree with
      # the paragraph it names, and an edited paragraph must be re-checked here. docc
      # runs from the meta root, where docc.json is; this repo used on its own has no
      # ../docc.json and skips the check.
      run: |
        if [ -f ../docc.json ]; then
          command -v docc >/dev/null 2>&1 || { echo "docc is not installed: curl -fsSL https://raw.githubusercontent.com/uxname/docc/main/install.sh | sh" >&2; exit 1; }
          cd .. && docc check --max-warnings 0
        fi

pre-push:
  commands:
    verify:
      run: npm run verify:push # fast checks + tests with coverage, E2E, Storybook build
