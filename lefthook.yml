# Хуки намеренно тонкие: вся логика живёт в npm-скриптах (package.json), а хук лишь
# вызывает один скрипт на стадию. Так разработчик может прогнать ровно те же проверки
# руками: `npm run verify:commit` (быстро) / `npm run verify:push` (полный прогон).
#
# Здесь нет CI — гарантия качества целиком на этих хуках, поэтому pre-push — суперсет:
# повторяет быстрые проверки и добавляет медленные.
pre-commit:
  commands:
    verify:
      run: npm run verify:commit # быстрые статические проверки + сканер секретов

pre-push:
  commands:
    verify:
      run: npm run verify:push # быстрые проверки + тесты с покрытием, E2E, сборка Storybook
