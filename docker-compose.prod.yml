# Production compose — a deploy artifact, deliberately NO build: block. Pulls
# <IMAGE_REGISTRY>litefront:<IMAGE_TAG> from the registry; a failed pull fails
# the deploy instead of silently rebuilding from whatever source sits on the
# host. One image = one environment: VITE_* values are baked into the bundle at
# BUILD time, so the tag must point at an image built with THIS environment's
# .env (e.g. IMAGE_TAG=prod-v1.2.0) — never share a tag across environments.
# Local dev / building on this host uses docker-compose.yml instead. Full
# deploy guide: the meta repo's docs/DEPLOY.md.

services:
  app:
    image: "${IMAGE_REGISTRY:-}litefront:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    # Cap resources so a leak in the SSR process can't exhaust the host.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    # NO env_file on purpose: VITE_* are baked into the bundle at build time
    # and the Nitro server reads nothing at runtime except PORT (pinned below),
    # so the image runs WITHOUT any .env and build-time secrets never ride
    # into the container. An optional project-dir .env (or exported shell vars)
    # still feeds the ${PORT:-3000}/${IMAGE_*} interpolations below.
    environment:
      PORT: 3000
    # Published on loopback only — a host reverse proxy terminates TLS.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # Dokploy/Traefik variant: drop the "ports:" block above and join the
    # external proxy network instead (declare it at the bottom too):
    # networks:
    #   - dokploy-network
    # No healthcheck here on purpose: the app's HEALTHCHECK lives in the
    # Dockerfile — one source of truth, honored by any orchestrator.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# Dokploy/Traefik variant (see the app service's networks comment):
# networks:
#   dokploy-network:
#     external: true
