schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""RFC 3339 / ISO 8601 timestamp (e.g. 2024-01-02T15:04:05Z)."""
scalar DateTime

"""Arbitrary JSON value, serialized as a JSON object/scalar."""
scalar JSON

type Mutation {
  """Adds a job to the test queue"""
  addTestJob(message: String!): Boolean!
  """Echo mutation — returns the input text (ADMIN only, dev utility)"""
  echo(text: String!): String!
  """Update the current user profile fields"""
  updateProfile(input: ProfileUpdateInput!): Profile!
}

"""A user profile, created on first login from the OIDC subject."""
type Profile {
  """URL of the profile avatar image, if set."""
  avatarUrl: URL
  """Free-form user biography, if set."""
  bio: String
  """When the profile was first created."""
  createdAt: DateTime!
  """Human-readable display name, if set."""
  displayName: String
  """Unique profile identifier."""
  id: ID!
  """
  OIDC subject (`sub` claim) this profile is bound to — stable per identity provider.
  """
  oidcSub: String!
  """Roles granted to this profile; controls access to guarded operations."""
  roles: [ProfileRole!]!
  """When the profile was last modified."""
  updatedAt: DateTime!
}

"""
Access role granted to a profile; drives authorization on guarded fields.
"""
enum ProfileRole {
  """Full access — may call admin-only queries and mutations."""
  ADMIN
  """Standard authenticated user."""
  USER
}

"""
Fields a user may change on their own profile. Omitted fields are left unchanged.
"""
input ProfileUpdateInput {
  """New avatar image URL."""
  avatarUrl: URL
  """New biography text."""
  bio: String
  """New display name."""
  displayName: String
}

type Query {
  """Debug info: uptime, memory, app version, users count (ADMIN only)"""
  debug: JSON!
  """Echo back the input text (ADMIN only, dev utility)"""
  echo(text: String!): String!
  """Get the currently authenticated profile"""
  me: Profile!
  """Test i18n translation by username (ADMIN only)"""
  testTranslation(username: String!): String!
}

type Subscription {
  """Receive real-time updates when the current user profile changes"""
  profileUpdated: Profile!
}

"""Absolute URL string."""
scalar URL