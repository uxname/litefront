services:
  app:
    build:
      context: .
      # Version stamp baked into the bundle (visible in the browser console on
      # prod/stage). Prefer `npm run docker:build` / `npm run docker:up` — they
      # fill SOURCE_COMMIT from git automatically. A bare `docker compose build`
      # still works and just reports "unknown".
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
