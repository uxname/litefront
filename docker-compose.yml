services:
  app:
    # Stable, registry-ready name for local builds; set IMAGE_REGISTRY/IMAGE_TAG
    # to retag for a registry.
    image: "${IMAGE_REGISTRY:-}litefront:${IMAGE_TAG:-latest}"
    # This file exists to run THIS checkout's source, so always rebuild instead
    # of starting whatever the tag currently points at (someone else's commit).
    # The image itself is environment-agnostic — the public VITE_* values are
    # read from the container's environment at boot, not baked in — so nothing
    # here is bound to this .env. To run a pulled prebuilt image, use
    # docker-compose.prod.yml.
    pull_policy: build
    build:
      context: .
    restart: unless-stopped
    # Cap resources so a leak in the SSR process can't exhaust the host. Honored
    # by `docker compose up` (Compose v2); tune to the target host.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    # Dev convenience: the whole .env goes in, so the runtime config (VITE_OIDC_*,
    # VITE_GRAPHQL_API_URL, …) is the same one `npm run start:dev` uses. The prod
    # compose lists the keys explicitly instead — see the comment there.
    env_file:
      - .env
    # The container always listens on 3000; PORT in .env only selects the HOST
    # port via the "${PORT:-3000}:3000" mapping (environment overrides env_file).
    environment:
      PORT: 3000
    # Published on loopback only — a host reverse proxy terminates TLS.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # No healthcheck here on purpose: the app's HEALTHCHECK lives in the
    # Dockerfile — one source of truth, honored by any orchestrator.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
