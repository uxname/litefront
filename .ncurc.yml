# npm-check-updates config — read by `npx ncu` and therefore by `npm run update`.
#
# Without this file `ncu -u` silently re-bumps the packages below, and the next
# `npm run check` / `npm run gen` breaks for a reason that looks unrelated to the
# update. Each hold is blocked by a THIRD-PARTY incompatibility, not by our code:
# re-check them when the linked cause is resolved, then drop the entry.
reject:
  # typescript 7 type-checks @ladle/react's shipped .tsx sources: its types entry
  # re-exports ./src/ui, and TS resolves .tsx before the sibling .d.ts, so
  # skipLibCheck does not apply and `tsc --noEmit` fails inside node_modules.
  # Unblocked when @ladle/react ships types that don't route through .tsx.
  - typescript
  # graphql 17 breaks `npm run gen`: @graphql-codegen/typescript-urql@5.0.1 caps
  # its peer range at ^16 and throws "Cannot read properties of undefined
  # (reading 'some')" while generating. Unblocked when that plugin supports 17
  # (or when the client-preset replaces it).
  - graphql
  # vitest 5 (and its coverage-v8 twin) break `npm run check`:
  # @testing-library/jest-dom@7.0.1 still augments the vitest 4 `Assertion<T>`
  # shape, so every jest-dom matcher fails to type-check. Unblocked when jest-dom
  # ships the vitest 5 signature.
  - vitest
  - '@vitest/coverage-v8'
  # vite 8.2.2 emits an SSR chunk that references `toast` without importing it —
  # the sonner -> shared/ui/Toaster -> index.ts re-export chain loses the binding
  # and the built server dies on boot with `ReferenceError: toast is not defined`.
  # package.json pins ~8.1.5; this keeps `ncu -u` from undoing that pin.
  # Unblocked when a vite 8.2.x build survives `npm run test:e2e:prod`.
  - vite
