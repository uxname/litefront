# Hooks are deliberately thin: all logic lives in npm scripts (package.json), and
# the hook just calls one script per stage. This way a developer can run the exact
# same checks by hand: `npm run verify:commit` (fast) / `npm run verify:push` (full).
#
# There is no CI here — the whole quality guarantee rests on these hooks, so
# pre-push is a superset: it repeats the fast checks and adds the slow ones.
pre-commit:
  commands:
    verify:
      run: npm run verify:commit # fast static checks + secrets scan

pre-push:
  commands:
    verify:
      run: npm run verify:push # fast checks + tests with coverage, E2E, Storybook build
