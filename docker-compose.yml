services:
  app:
    build:
      context: .
    restart: unless-stopped
    # Cap resources so a leak in the SSR process can't exhaust the host. Honored
    # by `docker compose up` (Compose v2); tune to the target host.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
