services:
  app:
    build:
      context: .
      # Version stamp baked into the bundle (visible in the browser console on
      # prod/stage). Set SOURCE_COMMIT in the environment when building, e.g.:
      #   SOURCE_COMMIT="$(git rev-parse --short HEAD)" docker compose build
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
